name: CI

on:
  push:
    branches: [alpha]
    tags:
      - "*"
  pull_request:
    branches: [alpha]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and run Luacheck
        uses: nebularg/actions-luacheck@v1
        with:
          args: "--no-color -q"

      - name: Create Alpha Package
        uses: BigWigsMods/packager@master
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/alpha' }}
        with:
          args: -S -n "{package-name}-{project-date-integer}-{project-revision}-{project-abbreviated-hash}{nolib}{classic}:{project-date-integer}-{project-revision}-{project-abbreviated-hash}{classic}{nolib}"
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      - name: Create Beta or Release Package
        uses: BigWigsMods/packager@master
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        with:
          args: -S
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
